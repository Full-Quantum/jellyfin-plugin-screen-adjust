<div id="screenAdjustConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">
            <h1>Screen Adjust defaults</h1>
            <p>Default presets are available to every account in the Jellyfin Web client helper. User presets override these only when selected.</p>
            <div id="screenAdjustStatus" role="status"></div>
            <div id="screenAdjustPresets"></div>
            <button id="screenAdjustAdd" type="button" class="raised">Add default preset</button>
            <button id="screenAdjustRestore" type="button" class="raised">Restore built-in presets</button>
            <button id="screenAdjustSave" type="button" class="raised button-submit">Save defaults</button>
            <p>Playback positioning is performed in Jellyfin Web by the bundled controls. Native apps and other Jellyfin clients are not affected.</p>
        </div>
    </div>
</div>
